name: Machine Learning CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      # ✨ Menambahkan working-directory agar pip mencari file requirements.txt di dalam folder MLProject
      working-directory: ./MLProject
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Run MLflow Experiment via MLproject
      env:
        DAGSHUB_CLIENT_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      # ✨ Mengubah lokasi perintah dari 'mlflow run .' menjadi 'mlflow run ./MLProject'
      run: |
        mlflow run ./MLProject --entry-point main -P n_estimators=120 -P max_depth=6
