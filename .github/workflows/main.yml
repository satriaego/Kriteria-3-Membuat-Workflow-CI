name: Machine Learning CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      working-directory: ./MLProject
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Run MLflow Experiment via MLproject
      env:
        DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        mlflow run ./MLProject --entry-point main -P n_estimators=120 -P max_depth=6 --env-manager local
    - name: 📦 Upload Training Artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: titanic-data-artifacts
        path: |
          ./MLProject/preprocessing/Titanic_cleaned_latest.csv
          ./MLProject/MLProject