name: Machine Learning CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    # ✨ Pasang token secara global di tingkat JOB agar terbaca sampai ke dalam sub-proses modelling.py
    env:
      DAGSHUB_CLIENT_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      working-directory: ./MLProject
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Run MLflow Experiment via MLproject
      run: |
        mlflow run ./MLProject --entry-point main -P n_estimators=120 -P max_depth=6 --env-manager local