name: Machine Learning CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      working-directory: ./MLProject
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Run MLflow Experiment via MLproject
      env:
        DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        mlflow run ./MLProject --entry-point main -P n_estimators=120 -P max_depth=6 --env-manager local

    - name: 💾 Save Compiled Model to Repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git pull origin main --rebase
        
        # Daftarkan file model biner .pkl ke pelacakan git
        git add ./model.pkl
        
        # Commit dengan mantra sakti [skip ci] agar tidak terjadi kiamat looping
        git commit -m "chore: upload compiled model artifact [skip ci]" || echo "Tidak ada perubahan model"
        git push origin main
    
    - name: 🔓 Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 🐳 Build and Push Docker Image via MLflow
      env:
        MLFLOW_TRACKING_URI: https://dagshub.com/satriaego/Kriteria-3-Membuat-Workflow-CI.mlflow
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        # Menggunakan mlflow models build-docker untuk membuat container secara otomatis
        # Kita beri nama image sesuai format: username_dockerhub/nama_repo:tag
        mlflow models build-docker \
          -m "models:/Eksperimen_SML_Satria_Ego_Vania/latest" \
          -n "${{ secrets.DOCKERHUB_USERNAME }}/titanic-model-ci:latest" --enable-mlserver
        
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/titanic-model-ci:latest